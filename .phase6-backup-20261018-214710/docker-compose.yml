version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: stadium_postgres
    restart: always
    environment:
      POSTGRES_USER: stadium_admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: stadium_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stadium_admin -d stadium_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stadium_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:
