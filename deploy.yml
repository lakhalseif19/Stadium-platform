name: Build & Deploy

# push sur main  -> staging (automatique)
# tag vX.Y.Z     -> production (approbation manuelle via l'environnement "production")
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      prefix: ${{ steps.v.outputs.prefix }}
      env_name: ${{ steps.v.outputs.env_name }}
    steps:
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "env_name=production" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "env_name=staging" >> "$GITHUB_OUTPUT"
          fi
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  build-push:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        component: [backend, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          push: true
          tags: ${{ needs.prepare.outputs.prefix }}/${{ matrix.component }}:${{ needs.prepare.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    needs: [prepare, build-push]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ needs.prepare.outputs.env_name }}
    concurrency:
      group: deploy-${{ needs.prepare.outputs.env_name }}
      cancel-in-progress: false
    env:
      ENV_NAME: ${{ needs.prepare.outputs.env_name }}
      IMAGE_TAG: ${{ needs.prepare.outputs.tag }}
      IMAGE_PREFIX: ${{ needs.prepare.outputs.prefix }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurer SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copier compose, nginx et scripts sur le VPS
        run: |
          scp docker-compose.prod.yml default.conf.template deploy.sh backup.sh restore-test.sh \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Connexion du VPS à GHCR
        env:
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "$SSH_USER@$SSH_HOST" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

      - name: Déployer (sauvegarde, migrations, rollback auto)
        run: |
          ssh "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && IMAGE_PREFIX='$IMAGE_PREFIX' bash deploy.sh '$ENV_NAME' '$IMAGE_TAG'"

      - name: Smoke test public
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          for i in $(seq 1 15); do
            if curl -fsS "$APP_URL/api/v1/health" >/dev/null; then
              echo "OK"; exit 0
            fi
            sleep 4
          done
          echo "Le smoke test a échoué sur $APP_URL"; exit 1
